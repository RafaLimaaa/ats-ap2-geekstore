---
test_name: GET /api/produtos retorna lista com estrutura correta

includes:
  - !include common.yaml

stages:
  - name: Listar produtos disponíveis
    request:
      url: "http://localhost:8000/api/produtos"
      method: GET
    response:
      status_code: 200
      headers:
        content-type: application/json

---
test_name: POST /api/comprar retorna valor_pago no corpo

includes:
  - !include common.yaml

stages:
  - name: Compra de teclado sem cupom
    request:
      url: "http://localhost:8000/api/comprar"
      method: POST
      headers:
        content-type: application/json
      json:
        produto: teclado
        cartao: "1234 5678 9012 3456"
        cupom: ""
    response:
      status_code: 200
      json:
        status: sucesso
        mensagem: !anystr
        valor_pago: !anyfloat

---
test_name: POST /api/comprar com GEEK20 retorna valor com desconto

includes:
  - !include common.yaml

stages:
  - name: Compra com cupom de desconto
    request:
      url: "http://localhost:8000/api/comprar"
      method: POST
      headers:
        content-type: application/json
      json:
        produto: teclado
        cartao: "1234 5678 9012 3456"
        cupom: GEEK20
    response:
      status_code: 200
      json:
        status: sucesso
        mensagem: !anystr
        valor_pago: 160.0
